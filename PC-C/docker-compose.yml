# Docker Compose untuk WORKER NODE PC-C (template)
# PC-C memiliki 1 GPU (RTX 2080), jadi hanya 1 worker
# Connect ke Master Server (10.28.83.141)

services:
  # Worker untuk GPU 0 only
  segmentation-worker-gpu0:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brainnav-worker-pc-c-gpu0
    environment:
      WORKER_NAME: pc-c-gpu0
      CUDA_VISIBLE_DEVICES: 0
      
      # RabbitMQ (connect ke Master Server)
      RABBITMQ_HOST: ${MASTER_IP:-10.28.83.141}
      RABBITMQ_PORT: 5674
      RABBITMQ_USER: ${RABBITMQ_USER:-brainnav}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-BrainNav_Secure_2025!}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-brainnav_vhost}
      RABBITMQ_QUEUE: segmentation_tasks
      QUEUE_HOMOGEN: segmentation_tasks_homogen
      QUEUE_HETEROGEN: segmentation_tasks_heterogen
      QUEUE_LEGACY: segmentation_tasks
      CLUSTER_MODES: heterogen
      GPU_TYPE: RTX2080
      
      # Redis (connect ke Master Server)
      REDIS_URL: redis://:${REDIS_PASSWORD:-BrainNav_Secure_2025!}@${MASTER_IP:-10.28.83.141}:6381/0
      SEGMENTATION_RESULT_TTL: 3600
      
      # nnU-Net 2D model
      NNUNET_MODEL_FOLDER: /models/nnunet_2d
      NNUNET_FOLDS: ${NNUNET_FOLDS:-0,1,2,3,4}
      DEVICE: cuda

      # Logging
      LOG_LEVEL: INFO
    ports:
      - "8001:8000"  # Health check & metrics
    volumes:
      - ${NNUNET_MODEL_PATH:-./nnunet_2d}:/models/nnunet_2d:ro
      - worker_gpu0_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

volumes:
  worker_gpu0_logs:
